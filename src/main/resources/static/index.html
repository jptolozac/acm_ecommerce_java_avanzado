<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACM Ecommerce - CI/CD</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
           display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    .card { background: #1e293b; padding: 2.5rem 3rem; border-radius: 16px; max-width: 560px;
            box-shadow: 0 10px 30px rgba(0,0,0,.4); }
    h1 { margin-top: 0; color: #38bdf8; }
    .dato { margin: .4rem 0; } .dato b { color: #94a3b8; display: inline-block; width: 90px; }
    code { background: #0f172a; padding: 2px 8px; border-radius: 6px; color: #fbbf24; }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="card">
    <!-- 👉 DEMO EN VIVO: también puedes cambiar este encabezado -->
    <h1>ACM Ecommerce — Entrega Final DevOps</h1>
    <p class="dato"><b>Mensaje:</b> <span id="mensaje">cargando…</span></p>
    <p class="dato"><b>Versión:</b> <code id="version">…</code></p>
    <p class="dato"><b>Entorno:</b> <span id="entorno">…</span></p>
    <p><a href="/api/v1/version">/api/v1/version</a> · <a href="/api/v1/products">/api/v1/products</a></p>
  </div>
  <script>
    fetch('/api/v1/version').then(r => r.json()).then(d => {
      document.getElementById('mensaje').textContent = d.mensaje;
      document.getElementById('version').textContent = d.version;
      document.getElementById('entorno').textContent = d.entorno;
    }).catch(() => document.getElementById('mensaje').textContent = 'No se pudo consultar la API');
  </script>
</body>
</html>
