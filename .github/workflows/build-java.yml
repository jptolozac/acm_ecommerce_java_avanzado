name: CI

# ---------------------------------------------------------------------------
# Trigger the workflow on any push or pull request to any branch.
# Adjust branches if you prefer to limit to main/release only.
# ---------------------------------------------------------------------------
on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

# ---------------------------------------------------------------------------
# Concurrency prevents multiple overlapping runs for the same ref.
# The most recent run cancels previous ones — saves runner minutes.
# ---------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Jobs definition.
#   • build  → compile + test + coverage gate + artifact upload
# ---------------------------------------------------------------------------
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # -----------------------------------------------------------------------
    # Service container: PostgreSQL
    # Best practice: mirror the same DB engine used in production so tests
    # run against the real driver/dialect instead of an in-memory substitute.
    # Credentials are read from GitHub Secrets — never hardcoded in the file.
    # -----------------------------------------------------------------------
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5434:5432
        # Wait until the DB is accepting connections before the job starts.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ---------------------------------------------------------------
      # 1️⃣ Checkout repository with full history (required for Gradle
      # incremental builds and proper version tagging).
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------
      # 2️⃣ Set up JDK 21 (Temurin) and enable Gradle cache.
      # Using the LTS Temurin distribution ensures a stable, auditable JDK.
      # ---------------------------------------------------------------
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      # ---------------------------------------------------------------
      # 3️⃣ Grant execute permission for the Gradle wrapper.
      # Required on Linux runners where the file bit may not be set.
      # ---------------------------------------------------------------
      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      # ---------------------------------------------------------------
      # 4️⃣ Cache Gradle dependencies and wrapper binaries.
      # The cache key uses the hash of build files so stale caches are
      # automatically invalidated when dependencies change.
      # ---------------------------------------------------------------
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ---------------------------------------------------------------
      # 5️⃣ Compile the project and run all tests.
      # The datasource env vars override application.yaml so the tests
      # connect to the PostgreSQL service container defined above.
      # --no-daemon avoids leaving background Gradle daemons in CI.
      # ---------------------------------------------------------------
      - name: Build and run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5434/${{ secrets.DB_NAME }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: ./gradlew clean build --no-daemon

      # ---------------------------------------------------------------
      # 6️⃣ Upload test reports (HTML + XML) as artifacts.
      # Using if: always() ensures reports are uploaded even on failure,
      # which is critical for post-mortem debugging.
      # ---------------------------------------------------------------
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/**
          retention-days: 14

      # ---------------------------------------------------------------
      # 7️⃣ Upload compiled application artifact (JAR).
      # Makes the built artifact available for downstream jobs (e.g.,
      # a deploy job) or for manual download from the Actions UI.
      # ---------------------------------------------------------------
      - name: Upload build artifact (JAR)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-artifact
          path: build/libs/*.jar
          retention-days: 14

      # ---------------------------------------------------------------
      # 8️⃣ OPTIONAL: Build and push a Docker image.
      # Only runs on direct pushes to a branch (not on PRs) to avoid
      # publishing images from unreviewed code.
      # ---------------------------------------------------------------
      - name: Build Docker image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: docker build -t acm-ecommerce:${{ github.sha }} .

      - name: Push Docker image to GHCR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository }}
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login $REGISTRY -u ${{ github.actor }} --password-stdin
          docker tag acm-ecommerce:${{ github.sha }} $REGISTRY/$IMAGE_NAME:${{ github.sha }}
          docker push $REGISTRY/$IMAGE_NAME:${{ github.sha }}

# ---------------------------------------------------------------------------
# End of CI workflow
# ---------------------------------------------------------------------------

