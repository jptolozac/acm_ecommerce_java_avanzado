# =============================================================================
# Pipeline CI/CD - acm_ecommerce_java_avanzado
# -----------------------------------------------------------------------------
#  CI:  build ──► test ──┐
#                        ├──► docker-build ──► security-scan (Trivy) ──► publish (GHCR)
#       codeql ──────────┘                                  │
#  CD (solo push a main):                                   └──► push-ecr (Amazon ECR) ──► deploy (ECS Fargate)
#
#  - Pull Request a main  -> solo CI (valida el cambio, publica pr-N en GHCR)
#  - Push a main          -> CI + CD (despliega automáticamente en AWS)
#  - Tag vX.Y.Z           -> CI + versión semántica en GHCR
# =============================================================================
name: CI/CD - Build & Deploy App

on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main" ]              # CD: cada push a main despliega en producción
    tags: [ "v*.*.*" ]
  workflow_dispatch:

# En PRs se cancelan ejecuciones viejas; en main NUNCA se cancela un despliegue a mitad
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: "temurin"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AWS_REGION: ${{ vars.AWS_REGION }}          # Variables del repositorio (no son secretos)
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  # ===========================================================================
  #                              INTEGRACIÓN CONTINUA
  # ===========================================================================
  build:
    name: Build (Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar JDK ${{ env.JAVA_VERSION }} con caché de Gradle
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Dar permisos de ejecución al wrapper
        run: chmod +x ./gradlew

      - name: Compilar y empaquetar (sin tests)
        run: ./gradlew clean assemble --no-daemon

      - name: Subir JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*-SNAPSHOT.jar
          retention-days: 7

  test:
    name: Test (JUnit + PostgreSQL)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar JDK ${{ env.JAVA_VERSION }} con caché de Gradle
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Dar permisos de ejecución al wrapper
        run: chmod +x ./gradlew

      - name: Ejecutar pruebas
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        run: ./gradlew test --no-daemon

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7

  codeql:
    name: Seguridad - CodeQL (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended

      - name: Ejecutar análisis CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

  docker-build:
    name: Docker - Build de imagen
    runs-on: ubuntu-latest
    needs: [ test, codeql ]
    timeout-minutes: 15
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Descargar el JAR generado en el job build
        uses: actions/download-artifact@v5
        with:
          name: app-jar
          path: build/libs

      # Etiquetas:  sha-<7>  siempre | pr-N en PRs | main en push a main
      #             1.0.3 / 1.0 / latest al publicar un tag vX.Y.Z
      - name: Calcular etiquetas (metadata)
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_PR_HEAD_SHA: "true"
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=pr,prefix=pr-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen y exportarla como .tar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Subir imagen como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  security-scan:
    name: Seguridad - Trivy (imagen)
    runs-on: ubuntu-latest
    needs: docker-build
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Descargar imagen
        uses: actions/download-artifact@v5
        with:
          name: docker-image
          path: ${{ runner.temp }}

      - name: Reporte Trivy en tabla (visible en el log)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Reporte Trivy en SARIF (pestaña Security)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-setup-trivy: true

      - name: Subir resultados de Trivy a GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Quality gate - bloquear si hay vulnerabilidades CRÍTICAS
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  publish:
    name: Docker - Publicar en GHCR
    runs-on: ubuntu-latest
    needs: [ docker-build, security-scan ]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar imagen
        uses: actions/download-artifact@v5
        with:
          name: docker-image
          path: ${{ runner.temp }}

      - name: Cargar imagen en Docker
        run: docker load --input ${{ runner.temp }}/image.tar

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar todas las etiquetas
        env:
          TAGS: ${{ needs.docker-build.outputs.tags }}
        run: |
          for tag in $TAGS; do
            echo "  -> $tag"
            docker push "$tag"
          done

  # ===========================================================================
  #                              DESPLIEGUE CONTINUO
  # Autenticación con AWS por OIDC: GitHub obtiene credenciales TEMPORALES
  # asumiendo un rol IAM. No hay access keys guardadas en el repositorio.
  # ===========================================================================
  push-ecr:
    name: CD - Publicar en Amazon ECR
    runs-on: ubuntu-latest
    needs: [ docker-build, security-scan ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write                 # Necesario para OIDC con AWS
    outputs:
      image: ${{ steps.push.outputs.image }}
      version: ${{ steps.push.outputs.version }}
    steps:
      - name: Descargar la imagen YA escaneada por Trivy
        uses: actions/download-artifact@v5
        with:
          name: docker-image
          path: ${{ runner.temp }}

      - name: Cargar imagen en Docker
        run: docker load --input ${{ runner.temp }}/image.tar

      - name: Credenciales AWS (OIDC -> rol IAM)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: false

      - name: Login en Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Se reutiliza la MISMA imagen inmutable (build once, deploy many):
      # solo se re-etiqueta para ECR, no se vuelve a construir.
      - name: Etiquetar y publicar en ECR
        id: push
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          VERSION="sha-${GITHUB_SHA::7}"
          SOURCE="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          TARGET="${ECR_REGISTRY}/${ECR_REPOSITORY}:${VERSION}"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$VERSION" >/dev/null 2>&1; then
            echo "La etiqueta $VERSION ya existe en ECR (tags inmutables): no se vuelve a publicar."
          else
            docker tag "$SOURCE" "$TARGET"
            docker push "$TARGET"
          fi
          echo "image=$TARGET" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### 📦 Imagen en Amazon ECR: \`$TARGET\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: CD - Desplegar en ECS Fargate
    runs-on: ubuntu-latest
    needs: push-ecr
    # Se activa cuando ya existe el servicio ECS (variable ECS_SERVICE configurada)
    if: vars.ECS_SERVICE != ''
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Credenciales AWS (OIDC -> rol IAM)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: false

      - name: Descargar la task definition actual
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_TASK_FAMILY }}" \
            --query taskDefinition > task-definition.json

      - name: Nueva revisión con la imagen nueva
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ needs.push-ecr.outputs.image }}
          environment-variables: |
            APP_VERSION=${{ needs.push-ecr.outputs.version }}

      - name: Desplegar en ECS (rolling update) y esperar estabilidad
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      - name: Smoke test - la URL pública responde con la nueva versión
        env:
          APP_URL: ${{ vars.APP_URL }}
          VERSION: ${{ needs.push-ecr.outputs.version }}
        run: |
          for i in $(seq 1 18); do
            BODY=$(curl -fsS "$APP_URL/api/v1/version" || true)
            echo "Intento $i: $BODY"
            if echo "$BODY" | grep -q "$VERSION"; then
              echo "✅ Versión $VERSION desplegada y respondiendo"
              {
                echo "## 🚀 Desplegado en AWS ECS Fargate"
                echo "- URL: $APP_URL"
                echo "- Versión: \`$VERSION\`"
                echo "- Respuesta: \`$BODY\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "❌ La URL no respondió con la versión $VERSION"
          exit 1
